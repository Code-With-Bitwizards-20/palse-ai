[build]
  # Build from repository root so npm workspaces are resolved correctly
  command = "npm run build"
  publish = "apps/web/out"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"

# Cache static Next.js assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

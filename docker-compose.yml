version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shorts_postgres
    restart: always
    environment:
      POSTGRES_USER: shorts_user
      POSTGRES_PASSWORD: shorts_secure_password
      POSTGRES_DB: shorts_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shorts_user -d shorts_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shorts_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: shorts_web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://shorts_user:shorts_secure_password@postgres:5432/shorts_db
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  media-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: shorts_media_worker
    restart: always
    environment:
      DATABASE_URL: postgresql://shorts_user:shorts_secure_password@postgres:5432/shorts_db
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
